description: SH1106 OLED display controller

compatible: "sinowealth,sh1106"

include: i2c-device.yaml

properties:
  width:
    type: int
    required: true
    description: Display width in pixels

  height:
    type: int
    required: true
    description: Display height in pixels

  segment-offset:
    type: int
    required: false
    description: Column offset (SH1106 specific)

  page-offset:
    type: int
    required: false
    description: Page offset

  display-offset:
    type: int
    required: false
    description: Display offset

  multiplex-ratio:
    type: int
    required: false
    description: Multiplex ratio

  segment-remap:
    type: boolean
    required: false
    description: Segment remap (horizontal flip)

  com-invdir:
    type: boolean
    required: false
    description: COM direction (vertical flip)

  reset-gpios:
    type: phandle-array
    required: false
    description: Reset GPIO specifier
